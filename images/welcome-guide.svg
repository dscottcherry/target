<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 207" role="img" aria-label="Friendly course guide welcoming new students">
  <defs>
    <linearGradient id="wg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f3f1"/>
      <stop offset="1" stop-color="#d3e9e5"/>
    </linearGradient>
  </defs>
  <rect width="365" height="207" fill="url(#wg-bg)"/>
  <circle cx="300" cy="40" r="70" fill="#ffffff" opacity="0.45"/>
  <circle cx="52" cy="180" r="46" fill="#ffffff" opacity="0.35"/>
  <!-- guide figure -->
  <g transform="translate(150 34)">
    <!-- body -->
    <path d="M-42 150 C-42 108 -20 86 12 86 C44 86 66 108 66 150 Z" fill="#14746f"/>
    <path d="M-42 150 C-42 118 -22 98 12 98 L12 150 Z" fill="#0f5c58"/>
    <!-- collar -->
    <path d="M-6 92 L12 112 L30 92 L22 86 L12 96 L2 86 Z" fill="#f4f1ea"/>
    <!-- head -->
    <circle cx="12" cy="52" r="34" fill="#f6c9a6"/>
    <path d="M-22 46 C-22 20 46 20 46 46 C46 30 34 16 12 16 C-10 16 -22 30 -22 46 Z" fill="#5a3b2b"/>
    <!-- face -->
    <circle cx="1" cy="52" r="3.4" fill="#3a2418"/>
    <circle cx="23" cy="52" r="3.4" fill="#3a2418"/>
    <path d="M2 66 Q12 74 22 66" fill="none" stroke="#b56a4a" stroke-width="3.4" stroke-linecap="round"/>
    <!-- waving arm -->
    <path d="M52 104 C74 96 92 78 96 58" fill="none" stroke="#f6c9a6" stroke-width="17" stroke-linecap="round"/>
    <circle cx="98" cy="52" r="12" fill="#f6c9a6"/>
  </g>
  <!-- greeting bubble -->
  <g transform="translate(232 96)">
    <rect x="0" y="0" width="104" height="52" rx="14" fill="#ffffff"/>
    <path d="M18 52 l0 16 l18 -16 Z" fill="#ffffff"/>
    <text x="52" y="31" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="700" fill="#14746f">Hi! 👋</text>
  </g>
</svg>
