    <path d="M-40 210 C-80 196 -120 172 -150 150" fill="none" stroke="#e7a985" stroke-width="20" stroke-linecap="round"/>
    <circle cx="-152" cy="148" r="13" fill="#e7a985"/>
  </g>
  <!-- learner 1 -->
  <g transform="translate(150 300)">
    <path d="M-40 250 C-40 178 -18 150 20 150 C58 150 80 178 80 250 Z" fill="#14746f"/>
    <circle cx="20" cy="104" r="38" fill="#f6c9a6"/>
    <path d="M-16 100 C-16 66 56 66 56 100 C56 78 42 62 20 62 C-2 62 -16 78 -16 100 Z" fill="#6b4a34"/>
    <circle cx="10" cy="106" r="3.6" fill="#3a2418"/>
    <circle cx="30" cy="106" r="3.6" fill="#3a2418"/>
    <!-- tablet -->
    <rect x="-24" y="196" width="88" height="60" rx="8" fill="#0f5c58" transform="rotate(-8 20 226)"/>
    <rect x="-14" y="204" width="68" height="44" rx="4" fill="#e8f3f1" transform="rotate(-8 20 226)"/>
  </g>
  <!-- learner 2 -->
  <g transform="translate(300 330)">
    <path d="M-36 220 C-36 158 -16 132 18 132 C52 132 72 158 72 220 Z" fill="#0f5c58"/>
    <circle cx="18" cy="94" r="34" fill="#e7a985"/>
    <path d="M-14 92 C-14 60 50 60 50 92 C50 72 38 58 18 58 C-2 58 -14 72 -14 92 Z" fill="#8a8f98"/>
    <circle cx="9" cy="96" r="3.4" fill="#3a2418"/>
    <circle cx="27" cy="96" r="3.4" fill="#3a2418"/>
  </g>
</svg>
