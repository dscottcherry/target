<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 549" role="img" aria-label="A friendly instructor helping adults learn technology in a classroom">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5f3"/>
      <stop offset="1" stop-color="#dcebe7"/>
    </linearGradient>
  </defs>
  <rect width="688" height="549" fill="url(#cr-bg)"/>
  <!-- floor -->
  <rect y="430" width="688" height="119" fill="#cfe0db"/>
  <!-- whiteboard -->
  <g transform="translate(70 60)">
    <rect width="300" height="180" rx="8" fill="#ffffff" stroke="#c3d6d1" stroke-width="4"/>
    <line x1="28" y1="46" x2="180" y2="46" stroke="#14746f" stroke-width="8" stroke-linecap="round"/>
    <line x1="28" y1="82" x2="242" y2="82" stroke="#f0913e" stroke-width="8" stroke-linecap="round"/>
    <line x1="28" y1="118" x2="150" y2="118" stroke="#9db8b2" stroke-width="8" stroke-linecap="round"/>
    <circle cx="252" cy="128" r="26" fill="none" stroke="#14746f" stroke-width="6"/>
    <path d="M252 116 v14 h11" fill="none" stroke="#14746f" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- instructor -->
  <g transform="translate(430 150)">
    <path d="M-46 300 C-46 210 -22 172 22 172 C66 172 90 210 90 300 Z" fill="#f0913e"/>
    <path d="M-6 176 L22 208 L50 176 L40 168 L22 184 L4 168 Z" fill="#f7f3ea"/>
    <circle cx="22" cy="120" r="42" fill="#e7a985"/>
    <path d="M-20 116 C-20 78 64 78 64 116 C64 92 48 74 22 74 C-4 74 -20 92 -20 116 Z" fill="#3d3d46"/>
    <circle cx="10" cy="120" r="4" fill="#3a2418"/>
    <circle cx="36" cy="120" r="4" fill="#3a2418"/>
    <path d="M12 138 q10 8 22 0" fill="none" stroke="#b56a4a" stroke-width="4" stroke-linecap="round"/>
